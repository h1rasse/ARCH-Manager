<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#060810">
<title>ARCH Manager</title>
<link rel="icon" href="./assets/module-icon.png" type="image/png">
<link rel="stylesheet" href="/src/styles.css">
</head>
<body>
<!-- Top bar -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand" aria-label="ARCH Manager">
      <span class="brand-logo"><img src="./assets/module-icon.png" alt="" aria-hidden="true"></span>
      <span class="brand-text">
        <span class="brand-name">ARCH<em>MANAGER</em></span>
        <span class="brand-sub">Kernel performance suite</span>
      </span>
    </div>
    <button id="reload" class="icon-btn" aria-label="Refresh">
      <!-- lucide: refresh-cw -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
    </button>
  </div>
</header>

<!-- Main view -->
<main id="view" aria-live="polite"></main>

<!-- Bottom nav -->
<nav id="nav" aria-label="Main navigation"></nav>

<!-- Confirm dialog -->
<dialog id="dlg" aria-modal="true">
  <h2 id="dt"></h2>
  <div id="db"></div>
  <div class="dlg-footer">
    <button id="no" class="btn btn-ghost">Cancel</button>
    <button id="yes" class="btn">Confirm</button>
  </div>
</dialog>
<script type="module" src="/src/main.js"></script>
</body>
</html>
