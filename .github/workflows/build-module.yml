name: Build ARCH Manager Module

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  webui:
    name: Build WebUI
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: webui
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Unit tests
        working-directory: webui
        run: npm test

      - name: Build WebUI
        working-directory: webui
        run: npm run build

      - name: Verify WebUI output
        run: |
          set -euo pipefail
          test -f webroot/index.html
          test -f webroot/app.js
          test -f webroot/styles.css
          ls webroot/assets/*
          ! grep -Eqi '(src|href)=["'"'"']?(https?:)?//' webroot/index.html

      - name: Upload WebUI
        uses: actions/upload-artifact@v4
        with:
          name: webroot
          path: webroot
          if-no-files-found: error

  build:
    name: Build ${{ matrix.abi }}
    needs: webui
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
            linker: aarch64-linux-android21-clang
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
            linker: armv7a-linux-androideabi21-clang
          - abi: x86_64
            target: x86_64-linux-android
            linker: x86_64-linux-android21-clang
          - abi: x86
            target: i686-linux-android
            linker: i686-linux-android21-clang
    env:
      NDK_VERSION: 26.3.11579264
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WebUI
        uses: actions/download-artifact@v4
        with:
          name: webroot
          path: webroot

      - name: Shell syntax check
        run: bash -n customize.sh service.sh action.sh uninstall.sh scripts/verify-package.sh

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK
        shell: bash
        run: sdkmanager "ndk;${NDK_VERSION}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Android ELF
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          TOOLCHAIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          LINKER="${TOOLCHAIN}/${{ matrix.linker }}"
          test -x "${LINKER}"
          case "${{ matrix.target }}" in
            aarch64-linux-android)
              export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${LINKER}"
              ;;
            armv7-linux-androideabi)
              export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="${LINKER}"
              ;;
            x86_64-linux-android)
              export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="${LINKER}"
              ;;
            i686-linux-android)
              export CARGO_TARGET_I686_LINUX_ANDROID_LINKER="${LINKER}"
              ;;
          esac
          cargo build --release --target "${{ matrix.target }}"

      - name: Verify ELF ABI
        shell: bash
        run: |
          set -euo pipefail
          BINARY="target/${{ matrix.target }}/release/archctl"
          test -x "${BINARY}"
          file "${BINARY}"
          readelf -h "${BINARY}" | tee /tmp/archctl-elf-header.txt
          grep -q "ELF" /tmp/archctl-elf-header.txt
          case "${{ matrix.abi }}" in
            arm64-v8a) grep -Eq "AArch64|aarch64" /tmp/archctl-elf-header.txt ;;
            armeabi-v7a) grep -Eq "ARM|arm" /tmp/archctl-elf-header.txt ;;
            x86_64) grep -Eq "X86-64|Advanced Micro Devices X86-64|x86-64" /tmp/archctl-elf-header.txt ;;
            x86) grep -Eq "Intel 80386|i386" /tmp/archctl-elf-header.txt ;;
          esac

      - name: Package flashable module
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version=//p' module.prop)"
          STAGE="dist/stage-${{ matrix.abi }}"
          PACKAGE="dist/ARCH-Manager-${VERSION}-${{ matrix.abi }}.zip"
          rm -rf "${STAGE}"
          mkdir -p "${STAGE}/bin"
          cp module.prop customize.sh service.sh action.sh uninstall.sh "${STAGE}/"
          cp banner.png "${STAGE}/banner.png"
          cp -r assets "${STAGE}/assets"
          cp -r webroot "${STAGE}/webroot"
          cp "target/${{ matrix.target }}/release/archctl" "${STAGE}/bin/archctl"
          chmod 0755 "${STAGE}/customize.sh" "${STAGE}/service.sh" "${STAGE}/action.sh" "${STAGE}/uninstall.sh" "${STAGE}/bin/archctl"
          test -f "${STAGE}/module.prop"
          test -f "${STAGE}/banner.png"
          test -f "${STAGE}/assets/icon.png"
          test -x "${STAGE}/bin/archctl"
          (cd "${STAGE}" && zip -q -r "../$(basename "${PACKAGE}")" .)
          unzip -l "${PACKAGE}"
          ./scripts/verify-package.sh "${PACKAGE}"
          unzip -q "${PACKAGE}" -d "dist/check-${{ matrix.abi }}"
          test -x "dist/check-${{ matrix.abi }}/bin/archctl"

      - name: Upload flashable module
        uses: actions/upload-artifact@v4
        with:
          name: ARCH-Manager-${{ matrix.abi }}
          path: dist/ARCH-Manager-*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download module artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ARCH-Manager-*
          path: release
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
